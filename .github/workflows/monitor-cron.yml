name: Monitor Cron

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

jobs:
  check-monitors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
            - name: Run monitor check sweep
        env:
          APP_URL: https://epicsem-web.onrender.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/check-monitors.mjs
      - name: Run campaign sweep
        env:
          APP_URL: https://epicsem-web.onrender.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/run-campaigns.mjs
